    <!-- Blocking Script to Resolve FOUC Theme Flashing -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("suriix_theme");
          var isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.remove("light");
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Inline Styles to Lock Background and Fade In Seamlessly -->
    <style>
      html.dark {
        background-color: #090714 !important;
      }
      html.light {
        background-color: #ffffff !important;
      }
      body {
        margin: 0;
        padding: 0;
        opacity: 0;
        transition: opacity 0.25s ease-in;
      }
      body.loaded {
        opacity: 1 !important;
      }
    </style>

    <!-- Production Runtime Debugger (Auto-catches and displays startup crashes) -->
    <script>
      window.addEventListener('error', function(e) {
        var errorDiv = document.getElementById('runtime-error-banner');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'runtime-error-banner';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.backgroundColor = '#ef4444';
          errorDiv.style.color = '#ffffff';
          errorDiv.style.padding = '16px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.whiteSpace = 'pre-wrap';
          errorDiv.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1)';
          document.body.appendChild(errorDiv);
        }
        errorDiv.innerText = '⚠️ Startup Crash Detected:\n' + e.message + '\nFile: ' + e.filename + '\nLine: ' + e.lineno + ':' + e.colno + '\nStack: ' + (e.error ? e.error.stack : 'No stack trace');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errorDiv = document.getElementById('runtime-error-banner');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'runtime-error-banner';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.backgroundColor = '#ef4444';
          errorDiv.style.color = '#ffffff';
          errorDiv.style.padding = '16px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.whiteSpace = 'pre-wrap';
          errorDiv.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1)';
          document.body.appendChild(errorDiv);
        }
        errorDiv.innerText = '⚠️ Unhandled Promise Rejection:\n' + e.reason;
      });
    </script>
